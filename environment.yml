# Conda environment for the Python parts of Plate-C.
#   conda env create -f environment.yml && conda activate plate-c
name: plate-c
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  # replicate-level statistics, plotting, demo (tested: Python 3.13, numpy 2.5, pandas 3.0, scipy 1.18, matplotlib 3.11)
  - numpy
  - pandas
  - scipy
  - matplotlib
  # versions used in the paper (Methods)
  - cooler=0.9.3
  - cooltools=0.7.1
  - bioframe=0.8.0
  - h5py
  - hicexplorer=3.7.6 # hicFindTADs, hicConvertFormat (06)
  - jupyterlab
  - pip
  - pip:
      - coolpuppy==1.1.0 # loop pileups for P2LL (07)
